name: Build Windows & Android Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: '3.44.8'

jobs:

  # ─────────────────────────────────────────────
  # Job 1: Super Admin — Windows EXE
  # ─────────────────────────────────────────────
  build-super-admin-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get - shared_models (ecommerce_saas)
        run: |
          cd ecommerce_saas/packages/shared_models
          flutter pub get

      - name: Flutter pub get - super_admin
        run: |
          cd ecommerce_saas/apps/super_admin
          flutter clean
          flutter pub get

      - name: Build Super Admin Windows
        run: |
          cd ecommerce_saas/apps/super_admin
          flutter build windows --release --no-tree-shake-icons

      - name: Package Windows Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build-artifacts"
          $candidates = @(
            "ecommerce_saas/apps/super_admin/build/windows/x64/runner/Release",
            "ecommerce_saas/apps/super_admin/build/windows/runner/Release"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $found = $c; break }
          }
          if ($found) {
            Write-Host "Packaging from: $found"
            Compress-Archive -Path "$found\*" -DestinationPath "build-artifacts/super_admin_windows.zip" -Force
          } else {
            Write-Error "Could not find build output directory!"
            exit 1
          }

      - name: Upload Artifact - Super Admin Windows
        uses: actions/upload-artifact@v4
        with:
          name: super-admin-windows
          path: build-artifacts/super_admin_windows.zip
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 2: Super Admin — Android APK
  # ─────────────────────────────────────────────
  build-super-admin-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get - shared_models (ecommerce_saas)
        run: |
          cd ecommerce_saas/packages/shared_models
          flutter pub get

      - name: Flutter pub get - super_admin
        run: |
          cd ecommerce_saas/apps/super_admin
          flutter clean
          flutter pub get

      - name: Build Super Admin APK
        run: |
          cd ecommerce_saas/apps/super_admin
          flutter build apk --release --no-tree-shake-icons

      - name: Rename & Move APK
        run: |
          mkdir -p build-artifacts
          find ecommerce_saas/apps/super_admin/build -name "*.apk" -exec cp {} build-artifacts/super_admin_android.apk \;

      - name: Upload Artifact - Super Admin Android
        uses: actions/upload-artifact@v4
        with:
          name: super-admin-android
          path: build-artifacts/super_admin_android.apk
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: Store Admin (st) — Windows EXE
  # ─────────────────────────────────────────────
  build-store-admin-windows:
