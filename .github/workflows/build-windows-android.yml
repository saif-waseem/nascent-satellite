          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get - shared_models (pa)
        run: |
          cd pa/shared_models
          flutter pub get

      - name: Flutter pub get - shared_ui (pa)
        run: |
          cd pa/shared_ui
          flutter pub get

      - name: Flutter pub get - store_admin
        run: |
          cd st
          flutter clean
          flutter pub get

      - name: Copy google-services.json
        run: |
          mkdir -p st/android/app
          cp Firebase_Credentials/st_google-services.json st/android/app/google-services.json

      - name: Build Store Admin APK
        run: |
          cd st
          flutter build apk --release --no-tree-shake-icons

      - name: Rename & Move APK
