name: Build macOS Apps
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.6'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Disable Code Signing
        run: |
          for dir in st po ua; do
            for cfg in \
              "$dir/macos/Flutter/Release.xcconfig" \
              "$dir/macos/Flutter/Debug.xcconfig"; do
              if [ -f "$cfg" ]; then
                echo "CODE_SIGN_IDENTITY=" >> "$cfg"
                echo "CODE_SIGNING_REQUIRED=NO" >> "$cfg"
                echo "CODE_SIGNING_ALLOWED=NO" >> "$cfg"
              fi
            done
            pbx="$dir/macos/Runner.xcodeproj/project.pbxproj"
            if [ -f "$pbx" ]; then
              sed -i '' \
                -e 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' \
                -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
                "$pbx"
            fi
          done

      - name: Remove macOS-incompatible packages
        run: |
          for dir in st po ua; do
            if [ -f "$dir/pubspec.yaml" ]; then
              sed -i '' \
                -e '/windows_printer/d' \
                -e '/print_bluetooth_thermal/d' \
                "$dir/pubspec.yaml"
            fi
          done

      - name: Build Store Admin (st)
        run: |
          cd st
          flutter clean
          sed -i '' 's/cloud_firestore:.*/cloud_firestore: ^6.5.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get
          flutter build macos --release --no-tree-shake-icons

      - name: Create DMG - Store Admin
        run: |
          mkdir -p build-artifacts
          create-dmg \
            --volname "Store Admin" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "build-artifacts/store_admin_macos.dmg" \
            "st/build/macos/Build/Products/Release/"

      - name: Build POS Cashier (po)
        run: |
          cd po
          flutter clean
          sed -i '' 's/cloud_firestore:.*/cloud_firestore: ^6.5.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get
          flutter build macos --release --no-tree-shake-icons

      - name: Create DMG - POS Cashier
        run: |
          create-dmg \
            --volname "POS Cashier" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "build-artifacts/pos_cashier_macos.dmg" \
            "po/build/macos/Build/Products/Release/"

      - name: Build User App (ua)
        run: |
          cd ua
          flutter clean
          sed -i '' 's/cloud_firestore:.*/cloud_firestore: ^6.5.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get
          flutter build macos --release --no-tree-shake-icons

      - name: Create DMG - User App
        run: |
          create-dmg \
            --volname "User App" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "build-artifacts/user_app_macos.dmg" \
            "ua/build/macos/Build/Products/Release/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-apps
          path: build-artifacts/
