name: store_admin
description: "A new Flutter project."
publish_to: "none"
version: 0.2.0

environment:
  sdk: ^3.10.4

dependencies:
  cloud_firestore: ^6.5.0
  firebase_auth: ^6.5.0
  firebase_core: ^4.10.0
  firebase_storage: ^13.4.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2
  google_fonts: ^8.0.2
  hooks_riverpod: ^3.3.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  shared_models:
    path: ../pa/shared_models
  shared_ui:
    path: ../pa/shared_ui
  shared_preferences: ^2.5.5
  firebase_messaging: ^16.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  hive_ce: any
  hive_ce_flutter: any
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  lottie: ^3.3.3
  cached_network_image: ^3.4.1
  onesignal_flutter: ^5.5.1
  cloud_functions: ^6.2.0
  csv: ^8.0.0
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  mobile_scanner: ^7.2.0
  flutter_animate: ^4.5.2
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  hive_ce_generator: any
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/launcher_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  analyzer: '>=6.0.0 <13.0.0'
