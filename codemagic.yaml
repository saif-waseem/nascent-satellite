workflows:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. POS Cashier — macOS
  # ─────────────────────────────────────────────────────────────────────────────
  pos-macos:
    name: "POS Cashier - macOS"
    instance_type: mac_mini_m2
    working_directory: po
    environment:
      flutter: 3.41.6
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean build files
        script: |
          flutter clean
          rm -rf build/

      - name: Remove incompatible packages
        script: |
          sed -i '' '/windows_printer/d' pubspec.yaml
          sed -i '' '/print_bluetooth_thermal/d' pubspec.yaml

      - name: Fix Firebase package versions
        script: |
          sed -i '' 's/cloud_firestore:.*/cloud_firestore: ^6.5.0/' pubspec.yaml
          sed -i '' 's/firebase_core:.*/firebase_core: ^4.10.0/' pubspec.yaml
          sed -i '' 's/firebase_auth:.*/firebase_auth: ^6.5.0/' pubspec.yaml
          sed -i '' 's/firebase_storage:.*/firebase_storage: ^13.4.0/' pubspec.yaml
          sed -i '' 's/firebase_messaging:.*/firebase_messaging: ^16.3.0/' pubspec.yaml
          rm -f pubspec.lock

      - name: Disable code signing
        script: |
          echo "CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          EXPANDED_CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =" >> macos/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          EXPANDED_CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =" >> macos/Flutter/Debug.xcconfig

      - name: Flutter pub get
        script: flutter pub get

      - name: Build macOS
        script: flutter build macos --release

    artifacts:
      - build/macos/Build/Products/Release/**/*.app

