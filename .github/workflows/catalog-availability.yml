name: Supabase catalog availability
on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  read-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the public storefront database
        env:
          CATALOG_KEY: sb_publishable_wVnAoc2K3TewY6Wpb0-D4Q_fX94VBMH
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 2 --retry-all-errors --max-time 10 \
            --header "apikey: $CATALOG_KEY" \
            'https://axcdhxubqzbzjpbhyvvf.supabase.co/rest/v1/products?select=id&limit=1' | jq -e 'type == "array"' >/dev/null
          curl --silent --show-error --fail --retry 2 --retry-all-errors --max-time 10 \
            --request POST --header "apikey: $CATALOG_KEY" --header "Content-Type: application/json" --data '{}' \
            'https://axcdhxubqzbzjpbhyvvf.supabase.co/rest/v1/rpc/order_stock_sync_healthy' | jq -e '. == true' >/dev/null
