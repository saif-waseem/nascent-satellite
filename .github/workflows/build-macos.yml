name: Build macOS Apps
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─────────────────────────────────────────────
  # Job 1: POS Cashier (po/)
  # ─────────────────────────────────────────────
  build-pos-cashier:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.6'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Disable Code Signing
        run: |
          for cfg in \
            "po/macos/Flutter/Release.xcconfig" \
            "po/macos/Flutter/Debug.xcconfig"; do
            if [ -f "$cfg" ]; then
              echo "CODE_SIGN_IDENTITY=" >> "$cfg"
              echo "CODE_SIGNING_REQUIRED=NO" >> "$cfg"
              echo "CODE_SIGNING_ALLOWED=NO" >> "$cfg"
            fi
          done
          pbx="po/macos/Runner.xcodeproj/project.pbxproj"
          if [ -f "$pbx" ]; then
            sed -i '' \
              -e 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' \
              -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
              "$pbx"
          fi

      - name: Patch connectivity_plus
        run: |
          find /Users/runner/.pub-cache/hosted/pub.dev \
            -name "PathMonitorConnectivityProvider.swift" \
            -exec sed -i '' \
            's/if #available(macOS 26\.0, \*), path\.isUltraConstrained {/if false {/g' \
            {} \;

      - name: Remove incompatible packages
        run: |
          sed -i '' '/windows_printer/d' po/pubspec.yaml
          sed -i '' '/print_bluetooth_thermal/d' po/pubspec.yaml

      - name: Force cloud_firestore version
        run: |
          sed -i '' 's/cloud_firestore:.*/cloud_firestore: ^6.5.0/' po/pubspec.yaml
          rm -f po/pubspec.lock

      - name: Build POS Cashier
        run: |
          cd po
          flutter clean
          flutter pub get
          flutter build macos --release --no-tree-shake-icons

      - name: Create DMG - POS Cashier
        run: |
          mkdir -p build-artifacts
          create-dmg \
            --volname "POS Cashier" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "build-artifacts/pos_cashier_macos.dmg" \
            "po/build/macos/Build/Products/Release/"

      - name: Upload Artifact - POS Cashier
        uses: actions/upload-artifact@v4
        with:
          name: pos-cashier-macos
          path: build-artifacts/pos_cashier_macos.dmg

