workflows:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. POS Cashier — macOS
  # ─────────────────────────────────────────────────────────────────────────────
  pos-macos:
    name: "POS Cashier - macOS"
    instance_type: mac_mini_m2
    working_directory: po
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Remove Windows-only packages
        script: |
          sed -i '' '/windows_printer/d' pubspec.yaml
          sed -i '' '/print_bluetooth_thermal/d' pubspec.yaml
          sed -i '' '/mobile_scanner/d' pubspec.yaml

      - name: Fix cloud_firestore version
        script: |
          sed -i '' 's/cloud_firestore:.*/cloud_firestore: ^6.5.0/' pubspec.yaml
          rm -f pubspec.lock

      - name: Disable code signing
        script: |
          echo "CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          EXPANDED_CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =" >> macos/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          EXPANDED_CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =" >> macos/Flutter/Debug.xcconfig

      - name: Flutter pub get
        script: flutter pub get

      - name: Build macOS
        script: flutter build macos --release --no-tree-shake-icons

    artifacts:
      - build/macos/Build/Products/Release/**/*.app

