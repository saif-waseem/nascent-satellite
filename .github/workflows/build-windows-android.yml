          cd pa/shared_ui
          flutter pub get

      - name: Flutter pub get - store_admin
        run: |
          cd st
          flutter clean
          flutter pub get

      - name: Build Store Admin Windows
        run: |
          cd st
          flutter build windows --release --no-tree-shake-icons

      - name: Package Windows Build
