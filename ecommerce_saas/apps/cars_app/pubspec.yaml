name: cars_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.11.4

dependencies:

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_models:
    path: ../../../pa/shared_models
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3
  hive_ce: any
  hive_ce_flutter: any
  path_provider: ^2.1.3
  pdf: ^3.11.1
  printing: ^5.13.0
  intl: ^0.20.2
  uuid: ^4.4.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  go_router: ^14.2.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  hive_ce_generator: any

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
